runtime:
  lease_ttl: 60s
  lease_renew_interval: 20s
  sqlite_busy_timeout: 5s
review:
  default_budget_cents: 1000
  currency: USD
  max_findings_per_unit: 5
llm:
  request_timeout: 90s
  default_tier: strong
  fallback_order: [strong, economy]
  tiers:
    strong:
      provider: openai
      model: gpt-5.4
      input_price_micros_per_million_tokens: 2500000
      output_price_micros_per_million_tokens: 15000000
      max_output_tokens: 4000
    economy:
      provider: openai
      model: gpt-5.4-mini
      input_price_micros_per_million_tokens: 750000
      output_price_micros_per_million_tokens: 4500000
      max_output_tokens: 4000
checkers:
  enabled: true
  docker_binary: docker
  image: code-review-agent-checker:go1.26-staticcheck2026.1
  image_inspect_attempts: 3
  image_inspect_retry_delay: 500ms
  cpus: "1"
  memory: 1g
  tmp_size: 1g
  pids: 128
  dependency_timeout: 2m
  proxy: https://proxy.golang.org
  definitions:
    - name: go_vet
      implementation: go_vet
      timeout: 1m
    - name: staticcheck
      implementation: staticcheck
      timeout: 1m
